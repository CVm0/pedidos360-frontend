<div class="min-h-screen flex items-center justify-center bg-slate-50">
  <div class="w-full max-w-sm rounded-xl border border-slate-200 bg-white p-8 shadow-sm text-center">
    <h1 class="text-2xl font-semibold text-slate-900">Pedidos360</h1>
    <p class="mt-2 text-sm text-slate-500">
      Iniciá sesión con tu cuenta corporativa para ver y gestionar los pedidos.
    </p>

    <button
      type="button"
      (click)="loginConMicrosoft()"
      class="mt-6 flex w-full items-center justify-center gap-3 rounded-md border border-slate-300 bg-white px-4 py-2.5 text-sm font-medium text-slate-700 hover:bg-slate-50"
    >
      <svg width="18" height="18" viewBox="0 0 21 21" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="9" height="9" fill="#f25022" />
        <rect x="11" y="1" width="9" height="9" fill="#7fba00" />
        <rect x="1" y="11" width="9" height="9" fill="#00a4ef" />
        <rect x="11" y="11" width="9" height="9" fill="#ffb900" />
      </svg>
      Iniciar sesión con Microsoft
    </button>
  </div>
</div>
