<div class="min-h-[calc(100dvh-53px)] bg-slate-50 px-6 py-8">
  <div class="mx-auto max-w-4xl">
    <h1 class="text-xl font-semibold text-slate-900">Hola, {{ userName }} 👋</h1>
    <p class="mt-1 text-sm text-slate-500">Estos son los pedidos activos.</p>

    <div class="mt-6 grid gap-4 sm:grid-cols-2">
      @for (pedido of pedidos; track pedido.id) {
        <div class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
          <div class="flex items-start justify-between">
            <div>
              <p class="text-sm font-semibold text-slate-900">{{ pedido.id }} · {{ pedido.cliente }}</p>
              <p class="mt-1 text-sm text-slate-500">{{ pedido.items }}</p>
            </div>
            <span
              class="whitespace-nowrap rounded-full px-2.5 py-1 text-xs font-medium"
              [class]="estadoClase(pedido.estado)"
            >
              {{ pedido.estado }}
            </span>
          </div>
          <p class="mt-3 text-sm font-medium text-slate-700">$ {{ pedido.total }}</p>
        </div>
      }
    </div>
  </div>
</div>
